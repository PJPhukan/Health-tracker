name: health_tracker
description: Stock Plate — personal health tracking with AI meal suggestions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.9.0
  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  health: ^13.3.1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  google_mobile_ads: ^9.1.0
  purchases_flutter: ^10.11.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Native launch screen — the very first frame, before Flutter boots.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F7F4EE"
  image: assets/branding/logo.png
  android_12:
    color: "#F7F4EE"
    image: assets/branding/logo.png
  web: false

# App launcher icon. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#F7F4EE"
  adaptive_icon_background: "#F7F4EE"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#F7F4EE"
    theme_color: "#0F4C4C"
